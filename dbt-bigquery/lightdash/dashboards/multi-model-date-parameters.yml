tiles:
  - h: 8
    properties:
      content: |
        ## Several date parameters, one dashboard

        Each control belongs to one model. Changing it re-runs only the tiles whose chart references that model's parameter. The grey unfiltered series on each chart should stay put.

        **Distinct names**

        - **Orders from date** (`dbt_orders.orders_from_date`) moves *Revenue on/after orders from date*.
        - **Baskets from date** (`dbt_baskets.baskets_from_date`) moves *Item profit on/after baskets from date*.
        - **Support requests from date** (`dbt_support_requests.support_from_date`) moves the filtered support series.
        - **Users created from** (`dbt_users.users_created_from`) moves the filtered customers series.

        **Same parameter name**

        `dbt_orders` and `dbt_baskets` both define `from_date`. They are still two controls, labelled **Orders: shared from date** and **Baskets: shared from date**. Moving one must not move the other model's series. The labels are different on purpose: the docs say identical labels make the controls look the same.

        Order, basket, request and created dates are shifted forward from a 13 February 2025 anchor, so a useful cutoff is around mid-2026 (the saved default is 1 June 2026), not the original 2023–2025 seed dates. Months before the cutoff drop to zero on the filtered series.
      hideFrame: false
