models:
  - name: dbt_orders_no_preagg
    description: "This table contains information on all the confirmed orders and their status"
    meta:
      metrics:
        avg_profit:
          type: average
          label: "Average Profit per Order"
          description: "Average profit earned per order. Track your margins as they grow!"
        median_profit:
          type: median
          label: "Median Profit"
          description: "Median of Profit"
        sum_of_profit:
          type: sum
          label: "Profit"
          description: "Total profit from all orders. The fruits of your labor!"
        sum_of_basket_total:
          type: sum
          label: "Revenue"
          description: "Total sales revenue from all orders."
        count_distinct_user_id:
          type: count_distinct
          label: "Unique Customers"
          description: "Number of unique customers who placed orders."
        average_of_basket_total:
          type: average
          label: "Average Order Value"
          description: "Average revenue per order. How much customers spend per visit to the garden center."
        count_distinct_order_id:
          type: count_distinct
          label: "Order Volume"
          description: "Total number of orders placed by customers. Watch your garden grow!"
      parameters:
        date_range:
          label: "Date Range"
          description: "Choose a date range"
          options: ["yesterday", "last 7 days", "last 30 days"]
          default: "last 7 days"
        custom_range_end:
          label: "End of custom date range"
          description: "The end of the custom date range"
          type: date
          allow_custom_values: true
        orders_dim_toggle:
          label: "Browser/Partner/Referrer"
          description: "Swap between browser, partner, referrer"
          options: ["browser", "referrer", "partner_name"]
          default: "partner_name"
        custom_range_start:
          label: "Start of custom date range"
          description: "The start of the custom date range"
          type: date
          allow_custom_values: true
    columns:
      - name: email
        label: "Email"
        description: "Email address of the user that placed the order."
        meta:
          dimension:
            type: string
      - name: profit
        label: "Profit"
        description: "Sum of item profits within the basket. Thus, the total profit of the order."
        meta:
          dimension:
            type: number
      - name: browser
        label: "Browser"
        description: "Web browser that the user used to place the order."
        meta:
          dimension:
            type: string
      - name: user_id
        label: "User id"
        description: "Unique user ID for the user that placed the order."
        meta:
          dimension:
            type: string
      - name: currency
        label: "Currency"
        description: "Three letter international currency code for the currency the order was paid with."
        meta:
          dimension:
            type: string
      - name: order_id
        label: "Order id"
        description: "Unique Order ID for the order."
        meta:
          dimension:
            type: string
      - name: referrer
        label: "Referrer"
        description: "Source from which the user was linked to the Thyme to Shine website."
        meta:
          dimension:
            type: string
      - name: is_sunday
        label: "Is sunday"
        description: "true if the date is a sunday"
        meta:
          dimension:
            type: boolean
      - name: order_date
        label: "Order date"
        description: "Timestamp of order placement by user."
        meta:
          dimension:
            type: timestamp
      - name: orders_dim
        label: "Browser/Partner/Referrer"
        description: "Use this dimension to swap between referrer, partner_name, browser"
        meta:
          dimension:
            type: string
      - name: partner_id
        label: "Partner id"
        description: "ID of the partner that is fulfilling the order."
        meta:
          dimension:
            type: string
      - name: basket_total
        label: "Basket total"
        description: "Sum of item prices for each item within the basket."
        meta:
          dimension:
            type: number
      - name: partner_logo
        label: "Partner logo"
        description: "URL of the partner logo"
        meta:
          dimension:
            type: string
      - name: partner_name
        label: "Partner name"
        description: "Full name of the partner that is fulfilling the order."
        meta:
          dimension:
            type: string
      - name: selected_dim
        label: "Selected dimension"
        description: "The dimension that is currently selected in the orders_dim_toggle parameter"
        meta:
          dimension:
            type: string
      - name: shipping_city
        label: "Shipping city"
        description: "Shipping city of the user that placed the order."
        meta:
          dimension:
            type: string
      - name: order_date_day
        label: "Order date day"
        description: "Timestamp of order placement by user."
        meta:
          dimension:
            type: date
      - name: order_date_hour
        label: "Order date hour"
        description: "Timestamp of order placement by user."
        meta:
          dimension:
            type: timestamp
      - name: order_date_week
        label: "Order date week"
        description: "Timestamp of order placement by user."
        meta:
          dimension:
            type: date
      - name: order_date_year
        label: "Order date year"
        description: "Timestamp of order placement by user."
        meta:
          dimension:
            type: date
      - name: order_date_month
        label: "Order date month"
        description: "Timestamp of order placement by user."
        meta:
          dimension:
            type: date
      - name: shipping_country
        label: "Shipping country"
        description: "Shipping country of the user that placed the order."
        meta:
          dimension:
            type: string
      - name: order_date_period
        label: "Order date period"
        description: "Date period (current period or previous period or previous year or out of range) chosen by the date_range parameter"
        meta:
          dimension:
