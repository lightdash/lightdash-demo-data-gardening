models:
  - name: dbt_customer_360
    description: >-
      One row per registered customer (every row of dbt_users, including
      customers with no orders or support tickets). Combines profile details,
      lifetime order totals and support activity. This is a lifetime snapshot:
      all order and support figures cover the customer's entire history, not a
      selected time window. Monetary values (revenue, profit) are assumed to be
      in USD; no currency conversion is applied.
    meta:
      label: Customer 360
      metrics:
        average_satisfaction:
          type: number
          label: Weighted Customer Satisfaction
          description: >-
            Satisfaction rating out of ten, weighted by number of rated
            tickets (total rating points divided by total rated tickets).
            Customers with more rated tickets count proportionally more.
          sql: ${sum_of_support_rating_total} / NULLIF(${sum_of_rated_support_tickets}, 0)
          round: 2
    columns:
      - name: user_id
        description: 'Unique user ID for the customer. Primary key of this model.'
        tests:
          - unique
          - not_null
        meta:
          dimension:
            type: string
          metrics:
            count_of_customers:
              type: count_distinct
              label: Customers
              description: 'Number of registered customers.'
      - name: email
        description: 'Email address of the customer.'
        meta:
          dimension:
            type: string
      - name: created_date
        description: 'Timestamp of customer registration.'
        meta:
          dimension:
            sql: >
              timestamp_add(
                ${TABLE}.created_date,
                interval timestamp_diff(current_timestamp(), timestamp '2025-02-13 00:00:00', second) second
              )
            type: timestamp
            time_intervals: [
              'DAY', 'WEEK', 'MONTH', 'QUARTER', 'YEAR' ]
      - name: browser
        description: 'Web browser the customer used.'
        meta:
          dimension:
            type: string
      - name: shipping_city
        description: 'Shipping city of the customer.'
        meta:
          dimension:
            type: string
      - name: shipping_country
        description: 'Shipping country of the customer.'
        meta:
          dimension:
            type: string
      - name: lifetime_orders
        description: 'Lifetime number of orders placed by the customer (0 if none).'
        meta:
          dimension:
            type: number
          metrics:
            sum_of_lifetime_orders:
              type: sum
              label: Lifetime Orders
              description: 'Total lifetime orders across the selected customers.'
      - name: lifetime_revenue
        description: 'Lifetime revenue from the customer, summed basket totals. Assumed USD.'
        meta:
          dimension:
            type: number
            format: '[$$]#,##0'
          metrics:
            sum_of_lifetime_revenue:
              type: sum
              label: Lifetime Revenue
              format: '[$$]#,##0'
              description: 'Total lifetime revenue (USD) across the selected customers.'
      - name: lifetime_profit
        description: 'Lifetime profit from the customer, summed order profit. Assumed USD.'
        meta:
          dimension:
            type: number
            format: '[$$]#,##0'
          metrics:
            sum_of_lifetime_profit:
              type: sum
              label: Lifetime Profit
              format: '[$$]#,##0'
              description: 'Total lifetime profit (USD) across the selected customers.'
      - name: first_order_date
        description: 'Timestamp of the customer''s first order. Null if the customer has never ordered.'
        meta:
          dimension:
            sql: >
              timestamp_add(
                ${TABLE}.first_order_date,
                interval timestamp_diff(current_timestamp(), timestamp '2025-02-13 00:00:00', second) second
              )
            type: timestamp
            time_intervals: [
              'DAY', 'WEEK', 'MONTH', 'QUARTER', 'YEAR' ]
      - name: last_order_date
        description: 'Timestamp of the customer''s most recent order. Null if the customer has never ordered.'
        meta:
          dimension:
            sql: >
              timestamp_add(
                ${TABLE}.last_order_date,
                interval timestamp_diff(current_timestamp(), timestamp '2025-02-13 00:00:00', second) second
              )
            type: timestamp
            time_intervals: [
              'DAY', 'WEEK', 'MONTH', 'QUARTER', 'YEAR' ]
      - name: support_tickets
        description: 'Lifetime number of support tickets raised by the customer (0 if none).'
        meta:
          dimension:
            type: number
          metrics:
            sum_of_support_tickets:
              type: sum
              label: Support Tickets
              description: 'Total lifetime support tickets across the selected customers.'
      - name: rated_support_tickets
        description: 'Number of the customer''s support tickets that received a feedback rating.'
        meta:
          dimension:
            type: number
          metrics:
            sum_of_rated_support_tickets:
              type: sum
              label: Rated Support Tickets
              description: 'Total rated support tickets; the weight for satisfaction.'
      - name: support_rating_total
        description: 'Sum of feedback ratings (out of ten) across the customer''s rated tickets.'
        meta:
          dimension:
            type: number
          metrics:
            sum_of_support_rating_total:
              type: sum
              label: Support Rating Points
              description: 'Total feedback rating points across rated tickets.'
