models:
  - name: dbt_support_requests
    description: 'This table contains information on all the support requests we’ve
      received'
    meta:
      label: Support requests
      pre_aggregates:
        - name: support_requests_daily
          dimensions:
            - reason
          metrics:
            - average_of_feedback_rating
            - count_of_request_id
            - count_distinct_user_id
          time_dimension: request_date
          granularity: DAY
      joins:
        - join: dbt_orders
          sql_on: ${dbt_orders.order_id} = ${dbt_support_requests.order_id}
      parameters:
        support_from_date:
          label: "Support requests from date"
          description: "Include support tickets whose request date is on or after this date. Scoped to dbt_support_requests only. Request dates are shifted forward from 13 February 2025, so a useful cutoff is around mid-2026."
          type: date
          default: "2026-06-01"
          allow_custom_values: true
      metrics:
        support_tickets_per_customer:
          type: number
          label: Support Tickets per Customer
          description: Average support ticket volume per unique customer. Calculated as total support tickets divided by unique customers who submitted a support ticket.
          sql: ${count_of_request_id} / NULLIF(${count_distinct_user_id}, 0)
          round: 2
          spotlight:
            visibility: show
            categories:
              - operations
        tickets_on_or_after_support_from_date:
          type: count
          label: "Tickets on/after support from date"
          description: "Count of support requests whose request date is on or after the Support requests from date parameter (dbt_support_requests.support_from_date). Earlier requests contribute nothing."
          sql: |
            CASE
              WHEN DATE(${request_date}) >= DATE(${lightdash.parameters.dbt_support_requests.support_from_date})
              THEN 1
            END
    columns:
      - name: request_id
        description: 'Unique ID of the request.'
        meta:
          metrics:
            count_distinct_request_id:
              type: count_distinct
              label: Support Tickets
              description: 'Total number of support requests submitted by customers.'
              spotlight:
                visibility: show
                categories:
                  - verified
                  - operations
            count_of_request_id:
              type: count
              label: Support Tickets
              description: >-
                Count of support tickets. dbt_support_requests is one row per
                request_id, so this is equivalent to count_distinct_request_id
                — but it's re-aggregatable, so it can live in pre-aggregates
                and be used in time-window roll-ups without query-time work.
              spotlight:
                visibility: show
                categories:
                  - verified
                  - operations
          dimension:
            type: string
      - name: order_id
        description: 'Unique Order ID that pertains to this request.'
        meta:
          dimension:
            type: string
      - name: request_date
        description: 'Timestamp of request submission by the user.'
        meta:
          dimension:
            sql: >
              timestamp_add(
                ${TABLE}.request_date,
                interval timestamp_diff(current_timestamp(), timestamp '2025-02-13 00:00:00', second) second
              )
            type: timestamp
            time_intervals: [
              'HOUR', 'MINUTE_OF_HOUR_NUM', 'HOUR_OF_DAY_NUM',
              'DAY', 'DAY_OF_WEEK_INDEX', 'DAY_OF_MONTH_NUM', 'DAY_OF_YEAR_NUM', 
              'DAY_OF_WEEK_NAME', 'WEEK', 'WEEK_NUM', 
              'MONTH', 'MONTH_NUM', 'MONTH_NAME',
              'QUARTER', 'QUARTER_NUM', 'QUARTER_NAME',
              'YEAR' ]
      - name: reason
        description: 'Determined cause of request.'
        meta:
          metrics:
            count_of_reason:
              type: count_distinct
              label: Unique Request Reasons
              description: 'Number of distinct support request categories. Know what your customers need help with!'
              spotlight:
                visibility: hide
          dimension:
            type: string
      - name: feedback_rating
        description: 'Feedback rating out of ten as received by post-request user survey.'
        meta:
          metrics:
            average_of_feedback_rating:
              type: average
              label: Customer Satisfaction Score
              description: 'Average customer satisfaction rating from post-support surveys. Keep your customer happiness blooming!'
              spotlight:
                visibility: hide
          dimension:
            type: number
      - name: order_date
        description: ""
        meta:
          dimension:
            type: timestamp
      - name: basket_total
        description: ""
        meta:
          dimension:
            type: number
      - name: profit
        description: ""
        meta:
          dimension:
            type: number
      - name: referrer
        description: ""
        meta:
          dimension:
            type: string
      - name: partner_id
        description: ""
        meta:
          dimension:
            type: string
      - name: partner_name
        description: ""
        meta:
          dimension:
            type: string
      - name: partner_commission
        description: ""
        meta:
          dimension:
            type: number
      - name: user_id
        description: ""
        meta:
          metrics:
            count_distinct_user_id:
              type: count_distinct
              label: Unique Customers
              description: Number of unique customers who submitted support tickets.
              spotlight:
                visibility: hide
                categories:
                  - verified
                  - operations
          dimension:
            type: string
      - name: email
        description: ""
        meta:
          dimension:
            type: string
      - name: created_date
        description: ""
        meta:
          dimension:
            type: timestamp
      - name: browser
        description: ""
        meta:
          dimension:
            type: string
