description: This table contains information on all of our users and customers
dimensions:
  - description: Web browser that the user used to place the order.
    name: browser
    sql: ${TABLE}.browser
    type: string
  - description: Timestamp of user creation.
    name: created_date
    sql: >
      timestamp_add(
        ${TABLE}.created_date,
        interval timestamp_diff(current_timestamp(), timestamp '2025-02-13 00:00:00', second) second
      )
    time_intervals:
      - HOUR
      - MINUTE_OF_HOUR_NUM
      - HOUR_OF_DAY_NUM
      - DAY
      - DAY_OF_WEEK_INDEX
      - DAY_OF_MONTH_NUM
      - DAY_OF_YEAR_NUM
      - DAY_OF_WEEK_NAME
      - WEEK
      - WEEK_NUM
      - MONTH
      - MONTH_NUM
      - MONTH_NAME
      - QUARTER
      - QUARTER_NUM
      - QUARTER_NAME
      - YEAR
    type: timestamp
  - description: Email address of the user.
    metrics:
      count_distinct_email:
        description: Number of unique email addresses on file.
        label: Registered Emails
        spotlight:
          visibility: hide
        type: count_distinct
    name: email
    sql: ${TABLE}.email
    type: string
    urls:
      - label: Send email
        url: 'mailto:${value.raw}?subject=Hello from Thyme Team!'
  - description: Full shipping address of the user, as an object.
    name: shipping_address
    sql: ${TABLE}.shipping_address
    type: string
  - description: Unique user ID for the user.
    metrics:
      count_distinct_of_user_id:
        description: Total number of registered customer accounts. Your community of plant lovers!
        label: Total Customers
        spotlight:
          categories:
            - verified
            - marketing
          visibility: show
        type: count_distinct
      count_of_user_id:
        description: >-
          Count of customers. dbt_users is one row per user_id, so this
          is equivalent to count_distinct_of_user_id — but it's
          re-aggregatable, so it can live in pre-aggregates and be
          used in time-window roll-ups without query-time work.
        label: Total Customers
        spotlight:
          categories:
            - verified
            - marketing
          visibility: show
        type: count
    name: user_id
    sql: ${TABLE}.user_id
    type: string
joins:
  - fields:
      - count_distinct_order_id
    join: dbt_orders
    sql_on: ${dbt_users.user_id} = ${dbt_orders.user_id}
label: Users
metrics:
  diff_emails_to_users:
    description: Difference between registered emails and user accounts. Useful for identifying data quality issues.
    label: Email-User Variance
    spotlight:
      categories:
        - beta
      visibility: show
    sql: ${count_distinct_email} - ${count_distinct_of_user_id}
    type: number
name: dbt_users
pre_aggregates:
  - dimensions:
      - browser
    granularity: DAY
    metrics:
      - count_of_user_id
    name: users_daily_by_browser
    time_dimension: created_date
sql_from: |-
  (
    select
      cast(user_id as string) as user_id,
      email,
      created_date,
      browser,
      shipping_address
    from `lightdash-healthcare-demo.lightdash_gardening_demo.users`
  )
type: model
